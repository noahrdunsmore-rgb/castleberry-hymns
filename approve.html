<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castleberry Hymns — Approve User</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 3rem 1rem; background: #f8f8f8; }
    img  { height: 60px; display: block; margin: 0 auto 1.5rem; }
    h2   { font-size: 1.4rem; margin-bottom: 0.75rem; }
    p    { color: #666; font-size: 0.95rem; }
    .spinner { margin: 2rem auto; width: 40px; height: 40px; border: 4px solid #eee;
               border-top-color: #C31832; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #C31832; }
    .error   { color: #888; }
  </style>
</head>
<body>
  <img src="logo.png" alt="Castleberry Church of Christ">
  <div id="status">
    <div class="spinner"></div>
    <p>Processing approval...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://nnutbmnmrjhoteqvcvgr.supabase.co'
    const ANON_KEY     = 'sb_publishable_xUNHW4SrOGZOowS3fFC7QA_jJBq3D5T'

    async function approve() {
      const token = new URLSearchParams(window.location.search).get('token')
      const el    = document.getElementById('status')

      if (!token) {
        el.innerHTML = '<h2 class="error">Invalid link.</h2>'
        return
      }

      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/aprove-user?token=${token}`, {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${ANON_KEY}` }
        })
        const text = await res.text()

        // The function returns HTML — extract the message from h2
        const match = text.match(/<h2[^>]*>(.*?)<\/h2>/)
        const msg   = match ? match[1] : (res.ok ? 'User approved!' : 'Something went wrong.')
        const ok    = res.ok

        el.innerHTML = `
          <h2 class="${ok ? 'success' : 'error'}">${msg}</h2>
          <p>Castleberry Church of Christ — Hymn Tracker</p>`
      } catch (e) {
        el.innerHTML = '<h2 class="error">Network error. Please try again.</h2>'
      }
    }

    approve()
  </script>
</body>
</html>
