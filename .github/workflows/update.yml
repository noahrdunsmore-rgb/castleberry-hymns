name: Weekly Hymn Update

on:
  schedule:
    # Sunday 11:00 PM CST = Monday 05:00 AM UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:   # lets you trigger it manually from the GitHub UI too

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit & push the updated JSON

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic youtube-transcript-api requests

      - name: Run hymn extraction script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python castleberry_hymns.py

      - name: Commit & push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add castleberry_songs.json processed_videos.json
          git diff --staged --quiet || \
            git commit -m "chore: weekly hymn update $(date -u +'%Y-%m-%d')" && \
            git push
