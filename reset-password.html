<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castleberry Hymns — Reset Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    img { height: 60px; display: block; margin: 0 auto 1.25rem; }
    h2 { font-size: 1.3rem; margin-bottom: 0.5rem; color: #111; }
    p.sub { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
    input {
      width: 100%; padding: 0.75rem 1rem;
      border: 1.5px solid #e0e0e0; border-radius: 8px;
      font-size: 1rem; margin-bottom: 0.85rem;
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #C31832; }
    button {
      width: 100%; padding: 0.85rem;
      background: #C31832; color: white;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error   { color: #888; font-size: 0.88rem; margin: 0.25rem 0 0.75rem; min-height: 1.2em; }
    .success { color: #C31832; font-weight: bold; font-size: 1.05rem; margin: 1rem 0; }
    a { color: #C31832; text-decoration: none; font-size: 0.9rem; }
    .spinner {
      margin: 2rem auto; width: 36px; height: 36px;
      border: 4px solid #eee; border-top-color: #C31832;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Castleberry Church of Christ">
    <div id="content">
      <div class="spinner"></div>
      <p style="color:#888;font-size:0.9rem;">Loading…</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase
    const sb = createClient(
      'https://nnutbmnmrjhoteqvcvgr.supabase.co',
      'sb_publishable_xUNHW4SrOGZOowS3fFC7QA_jJBq3D5T'
    )

    function showResetForm() {
      document.getElementById('content').innerHTML =
        '<h2>Set New Password</h2>' +
        '<p class="sub">Choose a strong password for your account.</p>' +
        '<input type="password" id="new-pass" placeholder="New password (min 8 characters)">' +
        '<input type="password" id="confirm-pass" placeholder="Confirm new password">' +
        '<div class="error" id="err"></div>' +
        '<button id="btn" onclick="doReset()">Update Password</button>'
    }

    function showError(msg) {
      document.getElementById('content').innerHTML =
        '<h2 style="color:#888;">Link Expired</h2>' +
        '<p style="color:#888;margin-top:0.5rem;font-size:0.9rem;">' + msg + '</p>' +
        '<p style="margin-top:1.5rem;"><a href="/">Back to sign in</a></p>'
    }

    async function doReset() {
      const pass    = document.getElementById('new-pass').value
      const confirm = document.getElementById('confirm-pass').value
      const errEl   = document.getElementById('err')
      const btn     = document.getElementById('btn')
      errEl.textContent = ''

      if (pass.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return }
      if (pass !== confirm) { errEl.textContent = 'Passwords do not match.'; return }

      btn.disabled = true; btn.textContent = 'Updating…'
      const { error } = await sb.auth.updateUser({ password: pass })

      if (error) {
        errEl.textContent = error.message
        btn.disabled = false; btn.textContent = 'Update Password'
      } else {
        document.getElementById('content').innerHTML =
          '<p class="success">Password updated!</p>' +
          '<p style="color:#888;font-size:0.9rem;margin-top:0.5rem;">You can now sign in with your new password.</p>' +
          '<p style="margin-top:1.5rem;"><a href="/">Sign In</a></p>'
      }
    }

    // Listen for the PASSWORD_RECOVERY event from Supabase
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        showResetForm()
      } else if (event === 'SIGNED_IN' && window.location.hash.includes('type=recovery')) {
        showResetForm()
      }
    })

    // Fallback: if no recovery event fires, show an error after 4 seconds
    setTimeout(() => {
      const content = document.getElementById('content')
      if (content && content.querySelector('.spinner')) {
        showError('This reset link has expired or is invalid. Please request a new one.')
      }
    }, 4000)
  </script>
</body>
</html>
