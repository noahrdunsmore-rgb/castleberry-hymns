<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castleberry Church of Christ — Hymn Tracker</title>
  <style>
    :root {
      --red:        #C31832;
      --red-dark:   #9B1226;
      --red-pale:   #FDEEF1;
      --dark:       #1C1C1C;
      --dark2:      #2E2E2E;
      --bg:         #F8F8F8;
      --white:      #FFFFFF;
      --text:       #1C1C1C;
      --muted:      #6B6B6B;
      --border:     #E0E0E0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--dark);
      padding: 0;
      border-bottom: 4px solid var(--red);
    }
    .header-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 1.1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .header-logo {
      height: 52px;
      width: auto;
      flex-shrink: 0;
    }
    .header-text h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.01em;
      line-height: 1.2;
    }
    .header-text p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.55);
      margin-top: 0.2rem;
    }

    /* ── Stats bar ── */
    .stats-bar {
      background: var(--red);
      display: flex;
      justify-content: center;
    }
    .stat {
      flex: 1;
      max-width: 180px;
      text-align: center;
      padding: 0.75rem 0.5rem;
      border-right: 1px solid rgba(255,255,255,0.25);
    }
    .stat:last-child { border-right: none; }
    .stat-number {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.75);
      margin-top: 0.2rem;
    }

    /* ── Controls ── */
    .controls {
      max-width: 860px;
      margin: 1.4rem auto 0;
      padding: 0 1.2rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-wrap {
      flex: 1;
      min-width: 180px;
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 0.9rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.55rem 0.9rem 0.55rem 2.2rem;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 0.95rem;
      background: var(--white);
      color: var(--text);
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { outline: none; border-color: var(--red); }
    select {
      padding: 0.55rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 0.85rem;
      background: var(--white);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    select:focus { outline: none; border-color: var(--red); }

    /* Leader search */
    .leader-wrap {
      min-width: 160px;
      position: relative;
    }
    .leader-wrap .search-icon { color: var(--muted); }

    /* ── Results meta ── */
    .results-meta {
      max-width: 860px;
      margin: 0.75rem auto 0.4rem;
      padding: 0 1.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ── Hymn list ── */
    .hymn-list {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.2rem 3rem;
    }

    .hymn-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.55rem;
      overflow: hidden;
      transition: box-shadow 0.18s, border-color 0.18s;
    }
    .hymn-card:hover {
      box-shadow: 0 2px 14px rgba(0,0,0,0.08);
      border-color: #ccc;
    }

    .hymn-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      user-select: none;
    }

    .hymn-name {
      flex: 1;
      font-size: 0.97rem;
      font-weight: 500;
    }
    .hymn-name mark {
      background: #FFEDC0;
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
    }

    .badge {
      border-radius: 20px;
      padding: 0.18rem 0.65rem;
      font-size: 0.73rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-count {
      background: var(--dark2);
      color: var(--white);
    }
    .badge-count.hot {
      background: var(--red);
      color: var(--white);
    }

    .chevron {
      color: var(--muted);
      font-size: 0.65rem;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .hymn-card.open .chevron { transform: rotate(180deg); }

    /* ── Occurrences table ── */
    .occurrences {
      display: none;
      border-top: 1.5px solid var(--border);
      padding: 0.6rem 1.1rem 0.9rem;
    }
    .hymn-card.open .occurrences { display: block; }

    .occ-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .occ-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.3rem 0.5rem 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    .occ-table td {
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid #F0F0F0;
      vertical-align: middle;
    }
    .occ-table tr:last-child td { border-bottom: none; }

    .leader-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--red-pale);
      color: var(--red-dark);
      border-radius: 20px;
      padding: 0.18rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .leader-chip.unknown {
      background: #F0F0F0;
      color: var(--muted);
      font-style: italic;
      font-weight: 400;
    }

    /* ── Empty / loading ── */
    .state-msg {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.1rem;
      color: var(--muted);
      font-size: 0.76rem;
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .header-logo   { height: 38px; }
      .header-text h1 { font-size: 1.05rem; }
      .stat-number   { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="header-inner">
    <img src="logo.png" alt="Castleberry Church of Christ" class="header-logo">
    <div class="header-text">
      <h1>Hymn Tracker</h1>
      <p>Every song sung in a cappella worship — searchable by title, date, and song leader</p>
    </div>
  </div>
</header>

<!-- ── Stats ── -->
<div class="stats-bar">
  <div class="stat">
    <div class="stat-number" id="stat-hymns">—</div>
    <div class="stat-label">Unique Hymns</div>
  </div>
  <div class="stat">
    <div class="stat-number" id="stat-services">—</div>
    <div class="stat-label">Services Tracked</div>
  </div>
  <div class="stat">
    <div class="stat-number" id="stat-leaders">—</div>
    <div class="stat-label">Song Leaders</div>
  </div>
  <div class="stat">
    <div class="stat-number" id="stat-since">—</div>
    <div class="stat-label">Tracking Since</div>
  </div>
</div>

<!-- ── Controls ── -->
<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search hymn title…" oninput="render()">
  </div>
  <div class="search-wrap leader-wrap">
    <span class="search-icon">🎤</span>
    <input type="text" id="leader-search" placeholder="Filter by song leader…" oninput="render()">
  </div>
  <select id="sort" onchange="render()">
    <option value="most-sung">Most Sung</option>
    <option value="az">A → Z</option>
    <option value="za">Z → A</option>
    <option value="recent">Most Recent</option>
  </select>
  <select id="year-filter" onchange="render()">
    <option value="">All Time</option>
  </select>
</div>

<div class="results-meta" id="results-meta"></div>

<div class="hymn-list" id="hymn-list">
  <div class="state-msg">Loading hymns…</div>
</div>

<footer id="footer">Updated automatically every Sunday night</footer>

<script>
  let allHymns = [];

  async function loadData() {
    try {
      const res = await fetch('castleberry_songs.json?v=' + Date.now());
      if (!res.ok) throw new Error(res.status);
      allHymns = await res.json();
      initYearFilter();
      updateStats();
      render();
    } catch (e) {
      document.getElementById('hymn-list').innerHTML =
        '<div class="state-msg">Could not load hymn data. Please try again later.</div>';
    }
  }

  function initYearFilter() {
    const years = new Set();
    allHymns.forEach(h => h.occurrences.forEach(o => years.add(o.date.slice(0, 4))));
    const sel = document.getElementById('year-filter');
    [...years].sort().reverse().forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      sel.appendChild(opt);
    });
  }

  function updateStats() {
    const allDates   = new Set();
    const allLeaders = new Set();
    allHymns.forEach(h => h.occurrences.forEach(o => {
      allDates.add(o.date);
      if (o.leader) allLeaders.add(o.leader.toLowerCase());
    }));
    const sorted = [...allDates].sort();

    document.getElementById('stat-hymns').textContent    = allHymns.length;
    document.getElementById('stat-services').textContent = allDates.size;
    document.getElementById('stat-leaders').textContent  = allLeaders.size || '—';
    document.getElementById('stat-since').textContent    = sorted.length
      ? fmtMonYear(sorted[0]) : '—';

    if (sorted.length) {
      const last = sorted[sorted.length - 1];
      document.getElementById('footer').textContent =
        `Last updated: ${fmtFull(last)} · Refreshes automatically every Sunday night`;
    }
  }

  function render() {
    const query  = document.getElementById('search').value.trim().toLowerCase();
    const leader = document.getElementById('leader-search').value.trim().toLowerCase();
    const sort   = document.getElementById('sort').value;
    const year   = document.getElementById('year-filter').value;

    let hymns = allHymns.map(h => {
      let occs = h.occurrences;
      if (year)   occs = occs.filter(o => o.date.startsWith(year));
      if (leader) occs = occs.filter(o => o.leader.toLowerCase().includes(leader));
      return { ...h, filteredOccs: occs };
    }).filter(h =>
      h.filteredOccs.length > 0 &&
      (!query || h.name.toLowerCase().includes(query))
    );

    hymns.sort((a, b) => {
      if (sort === 'most-sung') return b.filteredOccs.length - a.filteredOccs.length;
      if (sort === 'az')        return a.name.localeCompare(b.name);
      if (sort === 'za')        return b.name.localeCompare(a.name);
      if (sort === 'recent') {
        const aL = a.filteredOccs[a.filteredOccs.length - 1]?.date || '';
        const bL = b.filteredOccs[b.filteredOccs.length - 1]?.date || '';
        return bL.localeCompare(aL);
      }
      return 0;
    });

    const total = hymns.reduce((s, h) => s + h.filteredOccs.length, 0);
    let meta = `Showing ${hymns.length} hymn${hymns.length !== 1 ? 's' : ''} · ${total} total occurrence${total !== 1 ? 's' : ''}`;
    if (query)  meta += ` matching "${query}"`;
    if (leader) meta += ` led by "${leader}"`;
    if (year)   meta += ` in ${year}`;
    document.getElementById('results-meta').textContent = meta;

    const list = document.getElementById('hymn-list');
    if (!hymns.length) {
      list.innerHTML = '<div class="state-msg">No hymns match your search.</div>';
      return;
    }

    list.innerHTML = hymns.map(h => {
      const count   = h.filteredOccs.length;
      const badgeCls = count >= 5 ? 'badge badge-count hot' : 'badge badge-count';
      const rows = h.filteredOccs.map(o => {
        const ldr = o.leader
          ? `<span class="leader-chip">🎤 ${esc(o.leader)}</span>`
          : `<span class="leader-chip unknown">Unknown</span>`;
        return `<tr><td>${fmtFull(o.date)}</td><td>${ldr}</td></tr>`;
      }).join('');

      return `
        <div class="hymn-card" onclick="this.classList.toggle('open')">
          <div class="hymn-header">
            <span class="hymn-name">${highlight(esc(h.name), query)}</span>
            <span class="${badgeCls}">${count}×</span>
            <span class="chevron">▼</span>
          </div>
          <div class="occurrences">
            <table class="occ-table">
              <thead><tr><th>Date</th><th>Song Leader</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    }).join('');
  }

  /* ── Helpers ── */
  function fmtFull(d) {
    return new Date(d + 'T12:00:00').toLocaleDateString('en-US',
      { year: 'numeric', month: 'long', day: 'numeric' });
  }
  function fmtMonYear(d) {
    return new Date(d + 'T12:00:00').toLocaleDateString('en-US',
      { year: 'numeric', month: 'short' });
  }
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function highlight(escaped, q) {
    if (!q) return escaped;
    return escaped.replace(
      new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),
      '<mark>$1</mark>'
    );
  }

  loadData();
</script>

</body>
</html>
